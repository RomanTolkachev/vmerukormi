name: vet-energy-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vet_calorie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - vet_calorie_data_v4:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vet_calorie"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vet_calorie_data_v4:
